name: Linux CI

# The Linux port's build and test gate.
#
# `ci.yml` is the macOS gate and is deliberately left alone: nothing here may
# change what the macOS build does. This workflow exists so that a change made
# for Linux cannot quietly break Linux without anyone noticing, and so that
# "it builds on my machine" is replaced with a recorded result.
#
# It builds and tests the whole package **including the panel**, which is the
# reason the GTK packages are installed below. The panel's targets are only
# defined when pkg-config can find GTK4, so this job is also what says that the
# conditional manifest works on a clean machine rather than only here.
#
# See Docs/linux/migration-report.md.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than `latest`: the Linux port's assessment was made against
  # 6.4 and the toolchain's behaviour (which modulemaps exist, whether
  # FoundationNetworking is needed) is part of what is being tested.
  SWIFT_VERSION: 6.4.0
  SWIFT_BUILD_NAME: swift-6.4.0-RELEASE

jobs:
  build-and-test:
    # Pinned rather than ubuntu-latest so a runner image rollover cannot
    # change the glibc the build is measured against.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            libcurl4-openssl-dev \
            libedit-dev \
            libncurses-dev \
            libpython3-dev \
            libsqlite3-dev \
            libxml2-dev \
            pkg-config \
            zlib1g-dev

      # **The panel's dependencies, installed so the panel is really built.**
      # Without these the manifest finds no `gtk4.pc`, defines no panel targets,
      # and the job would pass while testing none of the drawing code — which is
      # the failure mode this step exists to avoid.
      - name: Install panel dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libx11-dev
          # **Best effort, because Ubuntu 24.04 does not package it.** The
          # panel must build and run without layer-shell — that is what the
          # `#if canImport(CGTK4LayerShell)` guards are for — and a job that
          # installed it unconditionally would never exercise that path.
          sudo apt-get install -y --no-install-recommends libgtk4-layer-shell-dev \
            || echo "::notice::gtk4-layer-shell is not packaged for this release; building without it"
          source Scripts/linux/panel-env.sh || true

      # The Ubuntu 24.04 build is used here because the runner is 24.04
      # (glibc 2.39). On a host below that — Debian 12, Deepin 25, Ubuntu
      # 22.04 — the 22.04 build is the one that works, which is what
      # Scripts/linux/swift-env.sh picks locally. Both are the same compiler.
      - name: Install Swift toolchain
        run: |
          set -euo pipefail
          archive="${SWIFT_BUILD_NAME}-ubuntu24.04.tar.gz"
          url="https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/${SWIFT_BUILD_NAME}/${archive}"
          curl -fsSL -o "/tmp/${archive}" "$url"
          mkdir -p "$HOME/.local/share/swift"
          tar -xzf "/tmp/${archive}" -C "$HOME/.local/share/swift"
          echo "SWIFT_TOOLCHAIN_ROOT=$HOME/.local/share/swift/${SWIFT_BUILD_NAME}-ubuntu24.04" >> "$GITHUB_ENV"

      - name: Swift version
        run: |
          source Scripts/linux/swift-env.sh
          swift --version
          swift --version | tee /tmp/swift-version.txt

      # Says what pkg-config found, which is what decides whether the panel is
      # in the build at all. Printed before the build so that a job which
      # skipped the panel says so at the top rather than in a diff of the
      # artifact list.
      - name: Panel dependencies
        run: source Scripts/linux/panel-env.sh

      # `swift build` is the first check, matching the macOS gate's ordering:
      # compile errors are the useful signal, and a test run that never
      # compiled says nothing.
      - name: Build
        id: build
        run: |
          source Scripts/linux/swift-env.sh
          swift build 2>&1 | tee /tmp/build.log

      - name: Test
        if: always()
        id: test
        run: |
          source Scripts/linux/swift-env.sh
          swift test 2>&1 | tee /tmp/test.log

      # **The panel is drawn here, with no display at all.** `--render` writes
      # the rail and the card into a PNG through the same code the window draws
      # with, so a CI run can look at the panel's appearance rather than only at
      # whether it compiled — and the artifact below is that picture.
      #
      # A render that produced nothing, or produced an image with no ink in it,
      # is the failure this catches: both are what a drawing bug looks like from
      # the outside, and neither is a compile error.
      - name: Render the panel
        if: steps.build.outcome == 'success'
        id: render
        run: |
          source Scripts/linux/swift-env.sh
          set -euo pipefail
          mkdir -p /tmp/panel
          # No DISPLAY: this is the headless path, and it is deliberately run
          # that way so that a dependency on a session would fail here.
          # `--open` puts the pointer where it opens the rail, asking the model
          # for the coordinates rather than being handed them: the sliver's
          # target is twenty points against the screen edge and the rings step
          # down by a number that depends on how many there are, and a copy of
          # that arithmetic in a shell script is a copy that goes stale.
          ./.build/debug/PulsePanel --render /tmp/panel/rail.png --rail --open
          ./.build/debug/PulsePanel --render /tmp/panel/panel.png --open
          for image in /tmp/panel/*.png; do
            size=$(stat -c%s "$image")
            echo "$image: $size bytes"
            # A blank PNG is around a hundred bytes; anything with the rail on
            # it is kilobytes. The bound is loose on purpose — it is there to
            # catch "drew nothing", not to pin a file size.
            if [ "$size" -lt 1000 ]; then
              echo "::error::$image is only $size bytes — the panel drew nothing"
              exit 1
            fi
          done

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Linux CI"
            echo
            echo '```'
            cat /tmp/swift-version.txt 2>/dev/null || echo "(toolchain not installed)"
            echo '```'
            echo
            echo "- build: **${{ steps.build.outcome }}**"
            if [ "${{ steps.build.outcome }}" != "success" ]; then
              echo
              echo '```'
              grep -E 'error:' /tmp/build.log 2>/dev/null | head -40 || echo "(no build log)"
              echo '```'
              echo
              echo "Total errors: $(grep -cE 'error:' /tmp/build.log 2>/dev/null || echo 0)"
            fi
            echo "- test: **${{ steps.test.outcome }}**"
            echo "- panel rendered: **${{ steps.render.outcome }}**"
            if [ "${{ steps.test.outcome }}" != "success" ]; then
              echo
              echo '```'
              grep -E '✘ (Suite|Test) ' /tmp/test.log 2>/dev/null | head -20 || echo "(no test log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-logs
          path: |
            /tmp/build.log
            /tmp/test.log
          if-no-files-found: ignore
          retention-days: 14

      # **The panel's appearance, as a file.** Anyone reviewing a change to the
      # rail can open it, and a reviewer who cannot run the app can still see
      # what moved.
      - name: Upload the panel render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-render
          path: /tmp/panel/*.png
          if-no-files-found: ignore
          retention-days: 30
